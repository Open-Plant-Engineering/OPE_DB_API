# Which backend each 3-letter code should use
[database_map]
XYZ = "postgres_xyz"
MNO = "postgres_mno"

# SQLite base settings
[sqlite]
base_dir = "dbs"

# PostgreSQL groups
[postgres_xyz]
user = "postgres"
password = "postgres"
host = "localhost"
port = 5432
database = "xyz"

[postgres_mno]
user = "postgres"
password = "postgres"
host = "localhost"
port = 5432
database = "mno"